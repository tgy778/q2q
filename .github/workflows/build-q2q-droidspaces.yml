name: Build q2q Kernel (KSU & No-KSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ksu: [true, false]
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            git gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip patch clang-12 llvm-12 lld-12

      - name: Download AOSP GCC toolchain
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            /opt/gcc-aarch64
          echo "/opt/gcc-aarch64/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          echo "=== Listing /opt/gcc-aarch64/bin ==="
          ls -la /opt/gcc-aarch64/bin/ | head -30
          echo "=== Check for aarch64-linux-android-ld ==="
          ls -la /opt/gcc-aarch64/bin/aarch64-linux-android-ld || echo "ld NOT found!"
          echo "=== Test ld ==="
          /opt/gcc-aarch64/bin/aarch64-linux-android-ld --version || echo "ld not executable"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: ${{ matrix.ksu }}-q2q

      - name: Download Droidspaces patches
        run: |
          git clone --depth 1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/droidspaces
          mkdir -p patches
          cp /tmp/droidspaces/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kABI_6_7_8.patch patches/ 2>/dev/null || true
          cp /tmp/droidspaces/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch patches/ 2>/dev/null || true

      - name: Apply Droidspaces kABI patches (manual, exact 手动补丁)
        run: |
          python3 << 'PYEOF'
          import re

          # ============================================================
          # 001: SYSVIPC - 修改 include/linux/sched.h
          # ============================================================
          print("===== Patching include/linux/sched.h for SYSVIPC =====")
          path = "include/linux/sched.h"
          with open(path) as f:
              content = f.read()

          if "ANDROID_KABI_USE(6, struct sysv_sem sysvsem)" in content:
              print("SYSVIPC already fixed, skipping")
          else:
              # Step 1: 注释掉原有 sysvsem/sysvshm
              content = re.sub(
                  r'\tstruct sysv_sem\t+sysvsem;',
                  '\t// struct sysv_sem\t\t\tsysvsem;',
                  content
              )
              content = re.sub(
                  r'\tstruct sysv_shm\t+sysvshm;',
                  '\t// struct sysv_shm\t\t\tsysvshm;',
                  content
              )

              # Step 2: 在 task_struct 末尾的 kABI 区域注入
              # 精确匹配：RESERVE(6) 之前是 RESERVE(5)，之后是 RESERVE(6)(7)(8)
              old = "\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);"
              new = """\tANDROID_KABI_RESERVE(5);
          #ifdef CONFIG_SYSVIPC
          	ANDROID_KABI_USE(6, struct sysv_sem sysvsem);
          	_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);
          #else
          	ANDROID_KABI_RESERVE(6);
          	ANDROID_KABI_RESERVE(7);
          	ANDROID_KABI_RESERVE(8);
          #endif"""

              if old in content:
                  content = content.replace(old, new, 1)
                  print("SYSVIPC injection: OK")
              else:
                  print("ERROR: Could not find kABI reserve pattern in sched.h")
                  # 打印诊断
                  idx = content.find("ANDROID_KABI_RESERVE(5)")
                  if idx > 0:
                      print("Context:")
                      print(repr(content[idx-50:idx+200]))

              with open(path, "w") as f:
                  f.write(content)

          # Verify
          with open(path) as f:
              content = f.read()
          print("SYSVIPC injected:", "ANDROID_KABI_USE(6, struct sysv_sem sysvsem)" in content)
          print("sysvsem commented:", "// struct sysv_sem" in content)

          # ============================================================
          # 002: POSIX_MQUEUE - 修改 include/linux/sched/user.h
          # ============================================================
          print("\n===== Patching include/linux/sched/user.h for POSIX_MQUEUE =====")
          path = "include/linux/sched/user.h"
          with open(path) as f:
              content = f.read()

          if "ANDROID_KABI_USE(1, unsigned long mq_bytes)" in content:
              print("POSIX_MQUEUE already fixed, skipping")
          else:
              # Step 1: 确保原 mq_bytes 已注释（可能已经注释过）
              content = content.replace(
                  "\tunsigned long mq_bytes;",
                  "\t//unsigned long mq_bytes;"
              )

              # Step 2: 注入 kABI 字段
              # 你的源码 user.h 末尾是：
              #     ANDROID_KABI_RESERVE(1);
              #     ANDROID_KABI_RESERVE(2);
              # };
              old = "\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n};"
              new = """#if defined(CONFIG_POSIX_MQUEUE)
          	ANDROID_KABI_USE(1, unsigned long mq_bytes);
          	ANDROID_KABI_RESERVE(2);
          #else
          	ANDROID_KABI_RESERVE(1);
          	ANDROID_KABI_RESERVE(2);
          #endif
          };"""

              if old in content:
                  content = content.replace(old, new, 1)
                  print("POSIX_MQUEUE injection: OK")
              else:
                  print("ERROR: Could not find kABI reserve pattern in user.h")
                  idx = content.find("struct ratelimit_state ratelimit;")
                  if idx > 0:
                      print("Context:")
                      print(repr(content[idx:idx+200]))

              with open(path, "w") as f:
                  f.write(content)

          # Verify
          with open(path) as f:
              content = f.read()
          print("mq_bytes active:", "ANDROID_KABI_USE(1, unsigned long mq_bytes)" in content)
          print("mq_bytes commented:", "//unsigned long mq_bytes" in content)

          # ============================================================
          # Final summary
          # ============================================================
          print("\n===== Final verification =====")
          with open("include/linux/sched.h") as f:
              s = f.read()
          with open("include/linux/sched/user.h") as f:
              u = f.read()
          print("sched.h SYSVIPC:", "ANDROID_KABI_USE(6, struct sysv_sem sysvsem)" in s)
          print("user.h POSIX_MQUEUE:", "ANDROID_KABI_USE(1, unsigned long mq_bytes)" in u)
          PYEOF

          echo ""
          echo "===== Grep verification ====="
          echo "--- sched.h ---"
          grep -n "sysvsem\|sysvshm\|ANDROID_KABI_USE" include/linux/sched.h | head -10
          echo "--- user.h ---"
          grep -n "mq_bytes\|ANDROID_KABI_USE" include/linux/sched/user.h

      - name: Add Droidspaces GKI config to defconfig
        run: |
          DEFCONFIG=arch/arm64/configs/vendor/q2q_eur_openx_defconfig
          cat >> $DEFCONFIG << 'EOF'

          # Droidspaces GKI required config
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_USER_NS=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          EOF

      - name: Integrate KernelSU (only for KSU version)
        if: matrix.ksu == true
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          DEFCONFIG=arch/arm64/configs/vendor/q2q_eur_openx_defconfig
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
      
      - name: Diagnose user_struct and sched.h
        run: |
          echo "===== include/linux/sched/user.h ====="
          cat include/linux/sched/user.h
          echo ""
          echo "===== struct task_struct kABI reserve area ====="
          grep -n "ANDROID_KABI_RESERVE\|ANDROID_KABI_USE\|ANDROID_OEM_DATA" include/linux/sched.h | head -30
          echo ""
          echo "===== Check ANDROID_KABI_USE macro definition ====="
          grep -rn "define ANDROID_KABI_USE" include/linux/android_kabi.h
          echo ""
          echo "===== Check mq_bytes ====="
          grep -n "mq_bytes" include/linux/sched/user.h || echo "mq_bytes NOT FOUND"
          
      - name: Disable VLA warnings in Samsung security modules
        run: |
          # 预防性修改三星安全模块的 Makefile
          for dir in \
            security/samsung/proca \
            security/samsung/defex_lsm \
            security/samsung; do
            if [ -f "$dir/Makefile" ]; then
              if ! grep -q "Wno-vla-extension" "$dir/Makefile" 2>/dev/null; then
                echo "" >> "$dir/Makefile"
                echo "# Disable VLA extension warning for standalone build" >> "$dir/Makefile"
                echo "ccflags-y += -Wno-vla-extension" >> "$dir/Makefile"
                echo "Modified: $dir/Makefile"
              fi
            fi
          done
      
      - name: Diagnose kperfmon
        run: |
          echo "=== Kconfig ==="
          cat drivers/kperfmon/Kconfig 2>/dev/null | head -20
          echo ""
          echo "=== Makefile ==="
          cat drivers/kperfmon/Makefile 2>/dev/null
          echo ""
          echo "=== drivers/Makefile reference ==="
          grep -n "kperfmon" drivers/Makefile
          echo ""
          echo "=== defconfig ==="
          grep -i "perfmon" arch/arm64/configs/vendor/q2q_eur_openx_defconfig || echo "not found"

      - name: Create proper perflog.h for kperfmon
        run: |
          for p in \
            "../../../system/core/liblog/include/log" \
            "../../../system/logging/liblog/include/log" \
            "../../system/core/liblog/include/log" \
            "../system/core/liblog/include/log"; do
            mkdir -p "$p" 2>/dev/null
            cat > "$p/perflog.h" << 'EOF'
          #ifndef _LIBS_LOG_PERFLOG_H
          #define _LIBS_LOG_PERFLOG_H
          #include <linux/types.h>
          #define PERFLOG_HEADER_SIZE 1
          #define PERFLOG_BUFF_STR_MAX_SIZE 256
          union _uPLogPacket {
              u8 data[PERFLOG_HEADER_SIZE + PERFLOG_BUFF_STR_MAX_SIZE];
          };
          #endif
          EOF
          done
          echo "perflog.h created in all candidate paths"
          find . -name "perflog.h" -not -path "./out/*"
      - name: Build kernel
        run: |
          set +e
          exec > >(tee -a build.log) 2>&1

          export ARCH=arm64
          export PROJECT_NAME=q2q
          export CROSS_COMPILE=aarch64-linux-android-
          export REAL_CC=$(which clang-12)
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KERNEL_MAKE_ENV="DTC_EXT=$(pwd)/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y"
          mkdir -p out

          # kperfmon dummy
          for p in \
            "../../../system/core/liblog/include/log" \
            "../../system/core/liblog/include/log" \
            "../system/core/liblog/include/log"; do
            mkdir -p "$p" 2>/dev/null
            echo "/* dummy */" > "$p/perflog.h" 2>/dev/null
          done

          # 第一次 make
          make -j$(nproc) -C $(pwd) O=$(pwd)/out $KERNEL_MAKE_ENV \
            ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE REAL_CC=$REAL_CC \
            CLANG_TRIPLE=$CLANG_TRIPLE CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            vendor/q2q_eur_openx_defconfig

          # 第二次 make（带 KCFLAGS 双保险）
          make -j$(nproc) -C $(pwd) O=$(pwd)/out $KERNEL_MAKE_ENV \
            ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE REAL_CC=$REAL_CC \
            CLANG_TRIPLE=$CLANG_TRIPLE CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            KCFLAGS="-Wno-vla-extension -Wno-error=vla-extension -Wno-error"

          BUILD_RESULT=$?
          echo "==========================================="
          echo "Make exited with code: $BUILD_RESULT"
          echo "==========================================="
          
          echo "===== All errors ====="
          grep -n -E "Error [0-9]+|error:|forbidden warning" build.log | head -40
          exit 0

      - name: Extract build errors from log
        if: always()
        run: |
          echo "===== Extracting errors from build.log ====="
          if [ -f build.log ]; then
            grep -n -B2 -A5 "error:" build.log || echo "No 'error:' lines found"
          else
            echo "build.log not found!"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.ksu && 'with-ksu' || 'no-ksu' }}-${{ github.sha }}
          path: build.log
          if-no-files-found: warn

      - name: List build outputs
        if: success()
        run: |
          echo "=== Kernel images ==="
          find out -name "Image*" -o -name "dtbo.img" 2>/dev/null
          echo "=== DTB files ==="
          find out -name "*.dtb" 2>/dev/null | head -20

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: q2q-kernel-${{ matrix.ksu && 'with-ksu' || 'no-ksu' }}-${{ github.sha }}
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dtb
            out/arch/arm64/boot/*.dtb
          if-no-files-found: warn
